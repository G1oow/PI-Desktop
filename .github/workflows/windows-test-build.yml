# Fork-only helper: build a client-testable Windows package from any ref.
#
# The release lane (`release.yml`) is not registered on this fork, so this
# workflow rebuilds the same Windows artifacts on demand and uploads them as a
# workflow artifact instead of publishing a Release. Delete this file once the
# change it verified has landed upstream.

name: Windows test build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 package
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installers (nsis, zip, portable)
        # `dist:win` builds the workspace, the release host-core sidecar, the
        # agent-runtime bundle and the Electron app, then packages with
        # `--publish never`.
        run: pnpm --filter @pi-desktop/desktop run dist:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pi-desktop-windows-x64
          if-no-files-found: error
          compression-level: 0
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
